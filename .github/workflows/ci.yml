name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: openwarp
          POSTGRES_PASSWORD: openwarp
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: openwarp
          MARIADB_DATABASE: openwarp
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENWARP_TEST_POSTGRES_URL: postgres://openwarp:openwarp@127.0.0.1:5432/postgres
      OPENWARP_TEST_MYSQL_URL: mysql://root:openwarp@127.0.0.1:3306/mysql
      # The static-rotation regressions drive a real PostgreSQL role lifecycle.
      OPENWARP_TEST_STATIC_PG: postgres://openwarp:openwarp@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --test-threads=2
      # The default build is core only, so the enterprise surfaces and their
      # tests need their own pass or they stop being compiled at all.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features -- --test-threads=2
      - run: node --test --test-concurrency=1 crates/server/tests/ui.test.cjs crates/server/tests/ui-contrast.test.cjs crates/server/tests/auth-v2.test.cjs crates/server/tests/e2e-libsodium.test.cjs crates/server/tests/vendor-integrity.test.cjs crates/server/tests/secret-health.test.cjs crates/server/tests/secret-health-ui.test.cjs crates/server/tests/secret-health-rotation.test.cjs crates/server/tests/secret-health-lockdown-ui.test.cjs tests/secret-health-enzoic.test.cjs tests/secret-health-providers.test.cjs tests/secret-health-enzoic-pairs.test.cjs tests/secret-health-enzoic-vectors.test.cjs crates/server/tests/workers-mfa.test.cjs crates/server/tests/workers-runtime.test.cjs crates/server/tests/workers-atomic.test.cjs crates/server/tests/workers-parity.test.cjs crates/server/tests/workers-protocol.test.cjs crates/server/tests/workers-live.test.cjs
      - run: python3 scripts/check-openapi.py
      # The SDK tests spawn the binary cargo test just built.
      - run: OPENWARP_BIN="$PWD/target/debug/openwarp-server" node --test sdks/typescript/sdk.test.ts
      - run: OPENWARP_BIN="$PWD/target/debug/openwarp-server" python3 -m unittest discover -s sdks/python -p 'test_*.py'

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: terraform-provider/go.mod
          cache-dependency-path: terraform-provider/go.sum
      - run: cargo build -p openwarp-server
      - run: cd terraform-provider && go build ./... && go vet ./...
      - run: cd terraform-provider && OPENWARP_BIN="$GITHUB_WORKSPACE/target/debug/openwarp-server" go test ./...

  worker:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: openwarp
          MARIADB_DATABASE: openwarp
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENWARP_SMOKE_MYSQL_URL: mysql://root:openwarp@127.0.0.1:3306/openwarp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Typecheck the Workers target
        run: cargo check -p openwarp-server --lib --target wasm32-unknown-unknown --no-default-features
      - name: Build the Worker bundle
        run: |
          cargo install worker-build --version 0.8.7
          cargo install wasm-bindgen-cli --version 0.2.130
          cd crates/server && worker-build --release --no-default-features
      - name: Deployment configuration gate
        run: node --test scripts/tests/portable-runtime/worker-deployment.test.cjs
      - name: Workerd smoke test
        run: |
          npm install --no-save wrangler@4.158.0
          export WRANGLER="$PWD/node_modules/.bin/wrangler"
          scripts/worker-smoke.sh
          node scripts/worker-runtime-smoke.mjs
          node scripts/worker-protocol-smoke.mjs
          node scripts/worker-live-smoke.mjs
          node scripts/worker-key-smoke.mjs
          sh scripts/worker-saml-smoke.sh
      - name: D1 migration driver
        run: WRANGLER="$PWD/node_modules/.bin/wrangler" scripts/d1-migrate-smoke.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: openwarp:ci
      # Building is not enough: a build-base/runtime glibc mismatch only shows
      # up when the binaries actually start.
      - name: Smoke the image
        run: |
          docker run -d --name openwarp-ci -p 8080:8080 \
            -e OPENWARP_MASTER_KEY="$(head -c 32 /dev/urandom | base64)" openwarp:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
          docker exec openwarp-ci openwarp --help >/dev/null
          docker exec openwarp-ci openwarp-migrate status >/dev/null
          docker stop openwarp-ci

  sdks-and-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache-dependency-path: terraform-provider-openwarp/go.sum
      - uses: hashicorp/setup-terraform@v3
      # The live SDK and provider tests start the real binary, so build it once
      # and point every suite at the absolute path.
      - run: cargo build --bin openwarp-server
      - name: TypeScript SDK
        run: |
          npm ci --prefix sdk/typescript
          OPENWARP_BIN="$PWD/target/debug/openwarp-server" npm test --prefix sdk/typescript
      - name: Rust SDK
        run: OPENWARP_BIN="$PWD/target/debug/openwarp-server" cargo test --manifest-path sdk/rust/Cargo.toml
      - name: Terraform provider unit and live client tests
        working-directory: terraform-provider-openwarp
        run: |
          go build ./...
          go vet ./...
          OPENWARP_BIN="$PWD/../target/debug/openwarp-server" go test ./...
      - name: Terraform provider acceptance tests
        working-directory: terraform-provider-openwarp
        env:
          TF_ACC: "1"
          OPENWARP_BIN: ${{ github.workspace }}/target/debug/openwarp-server
        run: go test ./internal/provider -v -timeout 20m
