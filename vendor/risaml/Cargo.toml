[dependencies.base64]
version = "0.23"

[dependencies.flate2]
version = "1"
features = ["rust_backend"]
default-features = false

[dependencies.quick-xml]
version = "0.41"

[dependencies.ribergshamra]
version = "0.11.0"
optional = true
default-features = false

[dependencies.thiserror]
version = "2"

[dependencies.time]
version = "0.3"
features = [
    "std",
    "parsing",
]
default-features = false

[dependencies.url]
version = "2"

[dependencies.uuid]
version = "1"
features = ["v4"]
