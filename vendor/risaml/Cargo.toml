[package]
edition = "2021"
rust-version = "1.88"
name = "risaml"
version = "0.7.0"
authors = [
    "Sebastian Sala (original saml-rs author)",
    "Rhein Industries",
]
build = false
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/docs/migrations/**",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/clippy.toml",
    "/rustfmt.toml",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Maintained fork of saml-rs: pure-Rust SAML 2.0 Service Provider and Identity Provider support, with XML security from ribergshamra."
homepage = "https://github.com/Rhein-Industries/risaml"
documentation = "https://docs.rs/risaml"
readme = "README.md"
keywords = [
    "saml",
    "sso",
    "xml",
    "authentication",
]
categories = [
    "authentication",
    "web-programming",
]
license = "MIT"
repository = "https://github.com/Rhein-Industries/risaml"

[package.metadata.docs.rs]
no-default-features = true
features = ["crypto-ribergshamra"]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
crypto-aws-lc = [
    "dep:ribergshamra",
    "ribergshamra/aws-lc",
]
crypto-bergshamra = ["crypto-ribergshamra"]
crypto-fips = [
    "dep:ribergshamra",
    "ribergshamra/fips",
]
crypto-legacy-algorithms = ["ribergshamra?/legacy-algorithms"]
crypto-legacy-rsa-decryption = ["ribergshamra?/legacy-rsa-decryption"]
crypto-pkcs11 = ["ribergshamra?/pkcs11"]
crypto-post-quantum = ["ribergshamra?/post-quantum"]
crypto-ribergshamra = [
    "crypto-rustcrypto",
    "crypto-legacy-algorithms",
    "crypto-post-quantum",
    "crypto-pkcs11",
]
crypto-rustcrypto = [
    "dep:ribergshamra",
    "ribergshamra/rustcrypto",
]
default = ["crypto-ribergshamra"]

