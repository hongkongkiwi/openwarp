{{- if .Values.eso.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openwarp.eso.fullname" . }}
  labels:
    {{- include "openwarp.eso.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.eso.replicas }}
  selector:
    matchLabels:
      {{- include "openwarp.eso.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openwarp.eso.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: openwarp-eso
          image: {{ printf "%s:%s" (default .Values.image.repository .Values.eso.image.repository) ((.Values.eso.image.tag | default .Values.image.tag) | default .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["openwarp-eso"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.eso.port }}
          # No credentials: each caller supplies an OpenWarp service token.
          env:
            - name: OPENWARP_ESO_ADDR
              value: "0.0.0.0:{{ .Values.eso.port }}"
            - name: OPENWARP_URL
              value: {{ default (printf "http://%s:%v" (include "openwarp.fullname" .) .Values.service.port) .Values.eso.openwarpUrl | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.eso.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
