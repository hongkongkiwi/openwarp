apiVersion: v1
kind: Service
metadata:
  name: {{ include "openwarp.fullname" . }}
  labels:
    {{- include "openwarp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "openwarp.selectorLabels" . | nindent 4 }}
