[package]
name = "openwarp-sdk"
version = "0.1.0"
edition = "2021"
description = "Async OpenWarp API client"

# Keep this package independent of the repository workspace.
[workspace]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
