[package]
name = "openwarp-server"
default-run = "openwarp-server"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "openwarp_server"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "openwarp-server"
path = "src/main.rs"

[[bin]]
name = "openwarp-migrate"
path = "src/bin/migrate.rs"

[dependencies]
openwarp-crypto = { path = "../crypto" }
axum = { version = "0.8", default-features = false, features = ["json", "query", "form", "matched-path"] }
tower = { version = "0.5", features = ["util"] }
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.10", features = ["oid"] }
hmac = "0.12"
base64ct = { version = "1", features = ["alloc"] }
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core", "fast"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tracing = "0.1"
sha1 = "0.10"
ipnet = "2"
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "rust_crypto"] }
x509-cert = { version = "0.2.5", features = ["builder", "pem"], optional = true }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"], optional = true }
rsa = { version = "0.9", features = ["pem"] }
ssh-key = { version = "0.6", features = ["ed25519", "rsa"], optional = true }
webauthn-rs = { version = "0.6", features = ["danger-allow-state-serialisation"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "query", "form", "matched-path", "tokio", "http1", "ws"] }
tokio.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
deadpool-postgres = "0.14"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
# Pure-Rust compression. TLS is compiled in because the crate panics when a URL
# sets require_ssl=true and no TLS backend exists; it stays off unless asked for.
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "default-rustls-ring"] }
redis = { version = "0.27", optional = true }
rcgen = { version = "0.13", optional = true }
keystore-ocsp = { version = "1.0", optional = true }
keystore-pki = { version = "1.0", optional = true }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
time = "0.3"
risaml = { version = "0.7", default-features = false, features = ["crypto-rustcrypto"], optional = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
ldap3 = { version = "0.11", default-features = false, features = ["tls-native"], optional = true }
native-tls = { version = "0.2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8", features = ["tokio-postgres", "d1"] }
# Sync primitives and io traits for the Workers MySQL lease socket.
tokio = { version = "1", default-features = false, features = ["sync", "io-util"] }
js-sys = "0.3"
uuid = { version = "1", features = ["js"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen-futures = "0.4"
tokio-postgres = { version = "0.7", default-features = false, features = ["js"] }

[features]
# Core only by default. The enterprise add-ons are opt-in because they pull in
# heavy dependency trees (SAML, X.509, SSH certificates) and most deployments
# never enable them. `enterprise` turns on all of them.
default = []
redis-cache = ["dep:redis"]
ldap = ["dep:ldap3", "dep:native-tls"]
# SAML metadata signing mints its SP certificate through rcgen, which the
# pki feature brings in.
saml = ["dep:risaml", "dep:rcgen", "pki"]
scim = []
pki = ["dep:x509-cert", "dep:p256", "dep:keystore-ocsp", "dep:keystore-pki", "dep:rcgen"]
ssh-ca = ["dep:ssh-key"]
transit = []
workload-identity = []
change-requests = []
enterprise = ["saml", "scim", "pki", "ssh-ca", "transit", "workload-identity", "change-requests", "ldap"]
# Test-only Worker route that runs the migration manifest against a D1 binding.
# The production Worker build does not enable it.
d1-smoke = []
live-db-tests = []

[[test]]
name = "rotation_regressions"
path = "tests/rotation_regressions.rs"
required-features = ["live-db-tests"]

[[test]]
name = "worker_saml"
path = "tests/worker_saml.rs"
required-features = ["saml"]

# The device certificate suites exercise the pki-gated routes.
[[test]]
name = "device_authorization"
path = "tests/device_authorization.rs"
required-features = ["pki"]

[[test]]
name = "device_delivery"
path = "tests/device_delivery.rs"
required-features = ["pki"]

[[test]]
name = "device_group_security"
path = "tests/device_group_security.rs"
required-features = ["pki"]

[[test]]
name = "device_lockdown"
path = "tests/device_lockdown.rs"
required-features = ["pki"]

[[test]]
name = "device_remaining"
path = "tests/device_remaining.rs"
required-features = ["pki"]

[[test]]
name = "device_postgres"
path = "tests/device_postgres.rs"
required-features = ["pki"]

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }
rcgen = "0.13"
risaml = { version = "0.7", default-features = false, features = ["crypto-rustcrypto"] }
keystore-pki = "1.0"
keystore-ocsp = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
lber = "0.4"
x509-parser = { version = "0.16", features = ["verify"] }
ciborium = "0.2"
# The passkey suites sign WebAuthn assertions, and several suites sign ES256
# JWTs; both run without the optional pki feature.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
