[package]
name = "openwarp-server"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "openwarp_server"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "openwarp-server"
path = "src/main.rs"

[dependencies]
openwarp-crypto = { path = "../crypto" }
axum = { version = "0.8", default-features = false, features = ["json", "query", "form", "matched-path"] }
tower = { version = "0.5", features = ["util"] }
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.10", features = ["oid"] }
hmac = "0.12"
base64ct = { version = "1", features = ["alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tracing = "0.1"
sha1 = "0.10"
ipnet = "2"
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "rust_crypto"] }
x509-cert = { version = "0.2.5", features = ["builder", "pem"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
rsa = { version = "0.9", features = ["pem"] }
ssh-key = { version = "0.6", features = ["ed25519", "rsa"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "query", "form", "matched-path", "tokio", "http1", "ws"] }
tokio.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
deadpool-postgres = "0.14"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
# Pure-Rust compression. TLS is compiled in because the crate panics when a URL
# sets require_ssl=true and no TLS backend exists; it stays off unless asked for.
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "default-rustls-ring"] }
redis = { version = "0.27", optional = true }
rcgen = "0.13"
ssh-key = { version = "0.6", features = ["ed25519", "rsa"] }
keystore-ocsp = "1.0"
keystore-pki = "1.0"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
time = "0.3"
risaml = { version = "0.7", default-features = false, features = ["crypto-rustcrypto"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
ldap3 = { version = "0.11", default-features = false, features = ["tls-native"], optional = true }
native-tls = { version = "0.2", optional = true }
webauthn-rs = { version = "0.6", features = ["danger-allow-state-serialisation"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8", features = ["tokio-postgres"] }
js-sys = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen-futures = "0.4"
tokio-postgres = { version = "0.7", default-features = false, features = ["js"] }
# Only the io traits: the Workers MySQL lease client reads and writes a socket.
tokio = { version = "1", default-features = false, features = ["io-util"] }

[features]
default = ["redis-cache", "ldap"]
redis-cache = ["dep:redis"]
ldap = ["dep:ldap3", "dep:native-tls"]
live-db-tests = []

[[test]]
name = "rotation_regressions"
path = "tests/rotation_regressions.rs"
required-features = ["live-db-tests"]

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
lber = "0.4"
x509-parser = { version = "0.16", features = ["verify"] }
ciborium = "0.2"
